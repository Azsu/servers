[project]
name = "mcp-server-searxng"
version = "0.1.0"
description = "A Model Context Protocol server providing tools to perform web searches via SearXNG"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anthropic, PBC." }]
keywords = ["search", "mcp", "llm", "automation", "searxng"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.1",
]

[project.scripts]
mcp-server-searxng = "mcp_server_searxng:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyright>=1.1.389"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-select = ["E", "F", "I", "N", "UP", "B", "A", "C90"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=mcp_server_searxng --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["mcp_server_searxng"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]

[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    "tests",
]
pythonVersion = "3.10"
typeCheckingMode = "strict"